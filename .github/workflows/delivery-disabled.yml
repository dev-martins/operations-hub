name: Entrega Preparada

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

env:
  DEPLOY_ENABLED: "false"
  DEPLOY_DISABLED_REASON: "Deploy desabilitado enquanto o repositorio publico ainda nao possui registry, ambiente alvo e credenciais protegidas com menor privilegio."

jobs:
  release-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Exibir contexto da esteira de entrega
        run: |
          echo "Workflow de entrega preparado."
          echo "Motivo da desabilitacao: $DEPLOY_DISABLED_REASON"
          echo "A ativacao depende de registry, ambiente alvo e secrets dedicados."

      - name: Validar build da imagem do backend
        run: docker build -f docker/backend/Dockerfile -t operations-hub/backend:${{ github.sha }} .

      - name: Validar build da imagem do frontend
        run: docker build -f docker/front/Dockerfile -t operations-hub/front:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: release-readiness
    if: ${{ env.DEPLOY_ENABLED == 'true' }}
    environment: production

    steps:
      - name: Placeholder de deploy
        run: echo "Ativar quando registry, credenciais e ambiente alvo estiverem provisionados."
