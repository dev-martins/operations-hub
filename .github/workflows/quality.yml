name: Qualidade

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Subir dependências da stack no Docker Compose
        run: docker compose up -d mysql mysql_testing redis rabbitmq

      - name: Instalar dependências do backend no Docker
        run: docker compose run --rm --no-deps backend composer install --no-interaction --prefer-dist

      - name: Validar formatação do backend com Pint
        run: docker compose run --rm --no-deps backend composer lint

      - name: Executar testes do backend no Docker
        run: docker compose run --rm --no-deps backend composer test

      - name: Executar testes do frontend no Docker
        run: docker compose run --rm --no-deps --entrypoint sh front -lc "npm ci && npm test"

      - name: Gerar build do frontend no Docker
        run: docker compose run --rm --no-deps --entrypoint sh front -lc "npm ci && npm run build"

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  container-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar build da imagem do backend
        run: docker build -f docker/backend/Dockerfile -t operations-hub/backend:${{ github.sha }} .

      - name: Validar build da imagem do frontend
        run: docker build -f docker/front/Dockerfile -t operations-hub/front:${{ github.sha }} .
