name: operations-hub

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
      front:
        condition: service_started
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    networks:
      - operations_hub

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - operations-backend-vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8088
      FRONTEND_URL: http://localhost:5178
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: operations_hub
      DB_USERNAME: operations
      DB_PASSWORD: operations
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: operations
      RABBITMQ_PASSWORD: operations
      ATTENDANCE_INTEGRATION_ENABLED: "true"
      ATTENDANCE_INTEGRATION_QUEUE_CONNECTION: rabbitmq
      ATTENDANCE_INTEGRATION_QUEUE: attendance-integrations
      DB_TEST_HOST: mysql_testing
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: operations_hub_test
      DB_TEST_USERNAME: operations_test
      DB_TEST_PASSWORD: operations_test
    depends_on:
      mysql:
        condition: service_healthy
      mysql_testing:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - operations_hub

  backend_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    command: sh -lc "composer install && php artisan rabbitmq:consume --queue=${ATTENDANCE_INTEGRATION_QUEUE:-attendance-integrations} --sleep=1 --tries=3 -v"
    volumes:
      - ./backend:/var/www/html
      - operations-backend-vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8088
      FRONTEND_URL: http://localhost:5178
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: operations_hub
      DB_USERNAME: operations
      DB_PASSWORD: operations
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: operations
      RABBITMQ_PASSWORD: operations
      ATTENDANCE_INTEGRATION_ENABLED: "true"
      ATTENDANCE_INTEGRATION_QUEUE_CONNECTION: rabbitmq
      ATTENDANCE_INTEGRATION_QUEUE: attendance-integrations
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - operations_hub

  front:
    build:
      context: .
      dockerfile: docker/front/Dockerfile
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./front:/app
      - operations-front-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8088/api
    ports:
      - "5178:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - operations_hub

  mysql:
    image: mysql:8.4
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: operations_hub
      MYSQL_USER: operations
      MYSQL_PASSWORD: operations
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - operations-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - operations_hub

  mysql_testing:
    image: mysql:8.4
    ports:
      - "3311:3306"
    environment:
      MYSQL_DATABASE: operations_hub_test
      MYSQL_USER: operations_test
      MYSQL_PASSWORD: operations_test
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - operations-mysql-testing-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - operations_hub

  redis:
    image: redis:7.4-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - operations_hub

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: operations
      RABBITMQ_DEFAULT_PASS: operations
    networks:
      - operations_hub

networks:
  operations_hub:

volumes:
  operations-backend-vendor:
  operations-mysql-data:
  operations-mysql-testing-data:
  operations-front-node-modules:
